<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4efe5" />
  <title>SmartChef — The Story of the Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="SmartChef home">
      <span class="brand-mark">S</span>
      <span>SmartChef</span>
    </a>
    <nav aria-label="Main menu">
      <a class="nav-link active" href="#menu">Menu</a>
      <a class="nav-link" href="#story">Our Story</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="story">
      <div class="hero-copy">
        <p class="eyebrow">Today's table</p>
        <h1>Every dish has<br><em>a story.</em></h1>
        <p class="intro">We serve the season's finest ingredients in their simplest, most beautiful form. Given time to cook, and made with care.</p>
      </div>
      <div class="hero-art" aria-label="A plated dish">
        <img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85" alt="A dish prepared with seasonal vegetables" />
        <span class="seal">Prepared<br>daily</span>
      </div>
    </section>

    <section class="menu-section" id="menu">
      <div class="menu-heading">
        <div>
          <p class="eyebrow">From the kitchen</p>
          <h2>Menu</h2>
        </div>
        <div class="filters" role="group" aria-label="Menu categories">
          <button class="filter active" data-category="all">All</button>
          <button class="filter" data-category="starter">Starters</button>
          <button class="filter" data-category="main">Main dishes</button>
          <button class="filter" data-category="dessert">Desserts</button>
        </div>
      </div>

      <div class="menu-grid" id="menuGrid"></div>
    </section>
  </main>

  <dialog id="dishDialog">
    <button class="dialog-close" aria-label="Close dialog">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
